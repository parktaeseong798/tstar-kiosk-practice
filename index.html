<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Star AI 키오스크 연습장 — 시니어를 위한 무인 주문기 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1a56db;
  --primary-dark:#173f9e;
  --success:#15803d;
  --success-bg:#dcfce7;
  --warn:#b45309;
  --warn-bg:#fef3c7;
  --bg-page:#eef2f7;
  --kiosk-bg:#ffffff;
  --surface:#f8fafc;
  --text:#111827;
  --text-secondary:#4b5563;
  --text-faint:#9ca3af;
  --border:#d8dee8;
  --radius-lg:24px;
  --radius-md:16px;
  --font-scale:1;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:calc(18px * var(--font-scale));}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg-page);
  color:var(--text);
  min-height:100vh;
  line-height:1.5;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
[role="button"]{cursor:pointer;}
[role="button"]:focus-visible, button:focus-visible{outline:3px solid var(--primary-dark);outline-offset:2px;}
.app-shell{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}

/* ---------- Header ---------- */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;background:var(--kiosk-bg);
  border-radius:var(--radius-md);border:1px solid var(--border);
  margin-bottom:22px;
}
.app-header .brand{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:900;color:var(--primary-dark);}
.app-header .brand span.dot{width:12px;height:12px;border-radius:50%;background:var(--primary);display:inline-block;}

/* ---------- Views ---------- */
.view{display:none;}
.view.active{display:block;}

/* ---------- Hub ---------- */
.hub-intro{
  background:var(--kiosk-bg);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:32px;margin-bottom:26px;
}
.hub-intro h1{font-size:1.9rem;font-weight:900;margin-bottom:12px;color:var(--text);}
.hub-intro p{font-size:1.05rem;color:var(--text-secondary);max-width:720px;}
.hub-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}
.hub-card{
  background:var(--kiosk-bg);border:2px solid var(--border);
  border-radius:var(--radius-lg);padding:26px 20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  position:relative;
}
.hub-card.enabled{cursor:pointer;}
.hub-card.enabled:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:0 10px 24px rgba(26,86,219,.14);}
.hub-card .emoji{font-size:3rem;}
.hub-card .name{font-size:1.25rem;font-weight:700;}
.hub-card .status{font-size:.95rem;color:var(--success);font-weight:700;}
.hub-card.disabled{opacity:.55;}
.hub-card.disabled .status{color:var(--text-faint);}
.badge-soon{
  position:absolute;top:14px;right:14px;background:var(--surface);
  color:var(--text-secondary);font-size:.78rem;font-weight:700;
  padding:4px 10px;border-radius:999px;border:1px solid var(--border);
}

/* ---------- Toast (hub) ---------- */
.hub-toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
  background:var(--text);color:#fff;padding:16px 26px;border-radius:999px;
  font-size:1.05rem;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;z-index:50;
}
.hub-toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- Practice toolbar ---------- */
.practice-toolbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  background:var(--kiosk-bg);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:12px 16px;margin-bottom:18px;
}
.toolbar-btn{
  display:flex;align-items:center;gap:6px;
  padding:12px 18px;border-radius:999px;font-weight:700;font-size:1rem;
  border:2px solid var(--border);background:var(--surface);color:var(--text);
}
.toolbar-btn:disabled{opacity:.4;cursor:not-allowed;}
.toolbar-btn.restart{border-color:#dc2626;color:#991b1b;background:#fef2f2;}
.toolbar-spacer{flex:1;}
.font-toggle{display:flex;gap:6px;}
.font-toggle button{
  width:42px;height:42px;border-radius:10px;border:2px solid var(--border);
  background:var(--surface);font-weight:900;font-size:1rem;
}
.progress-wrap{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text-secondary);}
.progress-dots{display:flex;gap:6px;}
.progress-dots .dot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.progress-dots .dot.done{background:var(--success);}
.progress-dots .dot.current{background:var(--primary);}

/* ---------- Kiosk frame ---------- */
.kiosk-frame{
  background:#26272b;border-radius:32px;padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.kiosk-screen{
  background:var(--kiosk-bg);border-radius:20px;
  min-height:560px;padding:36px 32px;position:relative;overflow:hidden;
}
.screen-title{font-size:1.7rem;font-weight:900;margin-bottom:8px;}
.screen-sub{font-size:1.05rem;color:var(--text-secondary);margin-bottom:26px;}

.big-tap-btn{
  width:100%;min-height:220px;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-size:1.8rem;font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.big-tap-btn .emoji{font-size:4rem;}

.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.choice-card{
  border:2px solid var(--border);border-radius:var(--radius-lg);
  padding:30px 20px;text-align:center;font-size:1.3rem;font-weight:700;
  background:var(--surface);
}
.choice-card .emoji{font-size:2.6rem;display:block;margin-bottom:10px;}

.tabs{display:flex;gap:10px;margin-bottom:20px;}
.tab-btn{
  padding:12px 20px;border-radius:999px;font-weight:700;font-size:1.05rem;
  border:2px solid var(--border);background:var(--surface);color:var(--text-secondary);
}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}
.menu-card{
  border:2px solid var(--border);border-radius:var(--radius-md);
  padding:20px 14px;text-align:center;background:var(--surface);position:relative;
}
.menu-card .emoji{font-size:2.4rem;}
.menu-card .name{font-size:1.1rem;font-weight:700;margin:8px 0 4px;}
.menu-card .price{font-size:.95rem;color:var(--text-secondary);}
.menu-card.scanned{border-color:var(--success);background:var(--success-bg);}
.menu-card.sel{border-color:var(--primary);background:#eef2ff;}
.menu-card.scanned::after{content:"✅";position:absolute;top:8px;right:8px;font-size:1.2rem;}
.scan-total{font-size:1.35rem;font-weight:900;text-align:right;margin-top:18px;color:var(--primary-dark);}

.keypad-display{display:flex;justify-content:center;gap:14px;margin:24px 0 30px;}
.keypad-digit{
  width:56px;height:66px;border:2px solid var(--border);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;font-weight:900;background:var(--surface);color:var(--text-faint);
}
.keypad-digit.filled{border-color:var(--primary);color:var(--primary-dark);background:#eef2ff;}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:340px;margin:0 auto;}
.keypad-btn{padding:20px 0;border-radius:var(--radius-md);border:2px solid var(--border);background:var(--surface);font-size:1.6rem;font-weight:800;color:var(--text);}
.keypad-btn.wide{font-size:1rem;}

.id-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center;margin:20px 0 8px;}
.id-dash{font-size:1.4rem;font-weight:900;color:var(--text-faint);margin:0 4px;}
.id-digit{
  width:34px;height:46px;border:2px solid var(--border);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:800;background:var(--surface);color:var(--text-faint);
}
.id-digit.filled{border-color:var(--primary);color:var(--primary-dark);background:#eef2ff;}

.toggle-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:22px;border:2px solid var(--border);border-radius:var(--radius-md);margin-bottom:24px;
}
.toggle-label{font-size:1.15rem;font-weight:700;}
.toggle-switch{
  width:64px;height:36px;border-radius:999px;background:var(--border);
  position:relative;flex:0 0 auto;transition:background .2s ease;
}
.toggle-switch.on{background:var(--success);}
.toggle-knob{
  position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;
  background:#fff;transition:left .2s ease;box-shadow:0 2px 4px rgba(0,0,0,.2);
}
.toggle-switch.on .toggle-knob{left:31px;}

.cart-row-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.cart-row-item .info{display:flex;justify-content:space-between;flex:1;font-size:1.15rem;gap:12px;}
.cart-row-item .info .label{color:var(--text-secondary);}
.delete-btn{background:none;border:2px solid transparent;font-size:1.3rem;padding:6px 10px;border-radius:10px;margin-left:10px;}
.delete-btn:hover{background:var(--surface);border-color:var(--border);}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.calendar-head{text-align:center;font-weight:700;color:var(--text-secondary);font-size:.95rem;padding-bottom:8px;}
.calendar-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:12px;border:2px solid var(--border);background:var(--surface);
  font-size:1.1rem;font-weight:700;
}
.calendar-day.today{border-color:var(--primary);background:#eef2ff;color:var(--primary-dark);}

.seat-map{display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:8px;}
.seat-row{display:flex;gap:10px;align-items:center;}
.seat-aisle{width:22px;}
.seat{
  width:54px;height:54px;border-radius:10px 10px 4px 4px;
  border:2px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;
}
.seat.occupied{background:var(--text-faint);border-color:var(--text-faint);color:#fff;opacity:.65;}
.seat-legend{display:flex;gap:20px;justify-content:center;margin-top:16px;font-size:.95rem;color:var(--text-secondary);font-weight:600;}
.seat-legend span{display:inline-flex;align-items:center;gap:6px;}
.seat-swatch{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);display:inline-block;}
.seat-swatch.occupied{background:var(--text-faint);border-color:var(--text-faint);}

.ticket-box{
  border:2px dashed var(--border);border-radius:var(--radius-md);
  padding:24px;margin-bottom:22px;background:var(--surface);
}

.option-block{margin-bottom:26px;}
.option-label{font-size:1.15rem;font-weight:700;margin-bottom:12px;}
.option-row{display:flex;gap:12px;flex-wrap:wrap;}
.option-btn{
  padding:16px 26px;border-radius:var(--radius-md);font-size:1.15rem;font-weight:700;
  border:2px solid var(--border);background:var(--surface);color:var(--text);
}
.option-btn.selected{background:var(--primary);border-color:var(--primary);color:#fff;}

.people-row{display:flex;gap:14px;flex-wrap:wrap;}
.people-card{
  flex:1 1 140px;border:2px solid var(--border);border-radius:var(--radius-lg);
  padding:26px 14px;text-align:center;font-size:1.3rem;font-weight:700;background:var(--surface);
}
.people-card .emoji{font-size:2.4rem;display:block;margin-bottom:8px;}

.qty-stepper{display:flex;align-items:center;gap:22px;justify-content:center;margin:24px 0;}
.qty-btn{
  width:64px;height:64px;border-radius:50%;background:var(--surface);
  border:2px solid var(--border);font-size:1.8rem;font-weight:900;color:var(--text);
}
.qty-num{font-size:2.2rem;font-weight:900;min-width:60px;text-align:center;}

.confirm-btn{
  width:100%;padding:22px;border-radius:var(--radius-md);
  background:var(--success);color:#fff;font-size:1.4rem;font-weight:900;margin-top:8px;
}
.ghost-btn{
  width:100%;padding:18px;border-radius:var(--radius-md);
  background:var(--surface);color:var(--text-secondary);font-size:1.1rem;font-weight:700;
  border:2px dashed var(--border);margin-top:12px;
}

.cart-box{border:2px solid var(--border);border-radius:var(--radius-md);padding:22px;margin-bottom:22px;}
.cart-row{display:flex;justify-content:space-between;font-size:1.15rem;padding:8px 0;border-bottom:1px solid var(--border);}
.cart-row:last-child{border-bottom:none;}
.cart-row .label{color:var(--text-secondary);}

.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.pay-card{
  border:2px solid var(--border);border-radius:var(--radius-lg);
  padding:26px 12px;text-align:center;font-size:1.2rem;font-weight:700;background:var(--surface);
}
.pay-card .emoji{font-size:2.6rem;display:block;margin-bottom:10px;}

.card-slot-wrap{display:flex;flex-direction:column;align-items:center;gap:24px;padding:20px 0;}
.card-slot{
  width:220px;height:140px;border-radius:14px;
  background:linear-gradient(135deg,#374151,#1f2937);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.4rem;
}
.card-slot.inserting{animation:pulse 1s ease infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.status-text{font-size:1.2rem;font-weight:700;color:var(--text-secondary);min-height:1.6em;}

.done-box{text-align:center;padding:20px 0;}
.done-box .emoji{font-size:4.2rem;margin-bottom:16px;}
.order-number{
  display:inline-block;background:var(--primary);color:#fff;font-size:2.2rem;font-weight:900;
  padding:14px 34px;border-radius:var(--radius-md);margin:16px 0 22px;
}

.cart-badge{
  position:sticky;bottom:0;left:0;right:0;margin-top:18px;
  background:var(--kiosk-bg);border:2px solid var(--primary);border-radius:var(--radius-md);
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:0 -6px 16px rgba(0,0,0,.06);flex-wrap:wrap;
}
.cart-badge .info{font-size:1.05rem;font-weight:700;color:var(--text);}
.cart-badge .info b{color:var(--primary-dark);}
.cart-badge button{
  padding:12px 22px;border-radius:999px;font-weight:800;font-size:1rem;
  background:var(--primary);color:#fff;
}
.cart-badge button:disabled{background:var(--border);color:var(--text-faint);}

#feedback-toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
  max-width:520px;background:var(--warn-bg);border:2px solid #f59e0b;color:var(--warn);
  padding:16px 24px;border-radius:var(--radius-md);font-size:1.05rem;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:60;
  text-align:center;
}
#feedback-toast.show{opacity:1;transform:translate(-50%,0);}
#feedback-toast.ok{background:var(--success-bg);border-color:#22c55e;color:var(--success);}

/* ---------- Summary view ---------- */
.summary-box{
  background:var(--kiosk-bg);border-radius:var(--radius-lg);border:1px solid var(--border);
  padding:44px;text-align:center;
}
.summary-box .emoji{font-size:4rem;margin-bottom:14px;}
.summary-box h2{font-size:1.9rem;font-weight:900;margin-bottom:10px;}
.summary-box p{color:var(--text-secondary);font-size:1.1rem;margin-bottom:26px;}
.stat-row{display:flex;justify-content:center;gap:36px;margin-bottom:32px;flex-wrap:wrap;}
.stat-item{min-width:140px;}
.stat-item .num{font-size:2rem;font-weight:900;color:var(--primary-dark);}
.stat-item .label{color:var(--text-secondary);font-size:.95rem;font-weight:600;}
.summary-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.summary-actions button{
  padding:18px 30px;border-radius:999px;font-size:1.1rem;font-weight:800;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:var(--surface);color:var(--text);border:2px solid var(--border);}

@media (max-width:640px){
  .choice-row{grid-template-columns:1fr;}
  .pay-grid{grid-template-columns:1fr;}
  .kiosk-screen{padding:24px 18px;}
}
/* ===== 승차권(버스·기차) 전용 ===== */
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.day-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:12px;border:2px solid var(--border);background:var(--surface);color:var(--text);}
.day-btn .dow{font-size:.85rem;font-weight:700;color:var(--text-secondary);}
.day-btn .num{font-size:1.2rem;font-weight:900;}
.day-btn.sun .num,.day-btn.sun .dow{color:#dc2626;}
.day-btn.sat .num,.day-btn.sat .dow{color:#2563eb;}
.day-btn.selected{background:var(--primary);border-color:var(--primary);}
.day-btn.selected .num,.day-btn.selected .dow{color:#fff;}
.route-bar{display:flex;align-items:center;justify-content:center;gap:10px 14px;padding:14px;border-radius:var(--radius-md);background:#eef2ff;font-size:1.3rem;font-weight:900;color:var(--primary-dark);margin-bottom:20px;flex-wrap:wrap;}
.route-bar small{font-size:.95rem;font-weight:700;color:var(--text-secondary);background:#fff;padding:4px 10px;border-radius:999px;}
.sched-list{display:flex;flex-direction:column;gap:10px;}
.sched-row{display:grid;gap:10px;align-items:center;padding:14px;border:2px solid var(--border);border-radius:var(--radius-md);background:var(--surface);}
.sched-row.bus{grid-template-columns:1.3fr 1fr 1fr 1.1fr;}
.sched-row.train{grid-template-columns:1.1fr 1.5fr 1fr 1fr;}
.sched-row.gone{opacity:.5;}
.sched-type{font-weight:900;font-size:1.1rem;}
.sched-type small,.sched-time small{display:block;font-size:.85rem;color:var(--text-secondary);font-weight:700;}
.sched-time{font-size:1.25rem;font-weight:900;}
.sched-info{font-size:.95rem;color:var(--text-secondary);font-weight:600;}
.sched-info b{font-size:1.1rem;color:var(--text);}
.sched-btn{padding:12px 6px;border-radius:12px;border:2px solid var(--primary);background:#fff;color:var(--primary-dark);font-weight:800;font-size:1.05rem;line-height:1.3;}
.sched-btn.special{border-color:#a16207;color:#854d0e;}
.sched-btn small{display:block;font-size:.9rem;font-weight:700;}
.sched-btn:disabled{border-color:var(--border);color:var(--text-faint);background:var(--surface);}
.type-ktx{color:#1d4ed8;}
.type-itx{color:#b91c1c;}
.type-mugung{color:#c2410c;}
.grade-tag{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.9rem;font-weight:800;background:#eef2ff;color:var(--primary-dark);border:1px solid #c7d2fe;}
.grade-tag.normal{background:#fff;border-color:var(--border);color:var(--text-secondary);}
.count-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border:2px solid var(--border);border-radius:var(--radius-md);margin-bottom:12px;}
.count-row .who{font-size:1.3rem;font-weight:800;}
.count-row .who small{display:block;font-size:.9rem;font-weight:600;color:var(--text-secondary);}
.count-ctrl{display:flex;align-items:center;gap:14px;flex:0 0 auto;margin-left:auto;}
.count-row{flex-wrap:wrap;}
.count-row .who{flex:1 1 140px;min-width:0;}
.count-ctrl .qty-btn{width:56px;height:56px;font-size:1.6rem;}
.count-ctrl .num{font-size:1.7rem;font-weight:900;min-width:36px;text-align:center;}
.qty-btn:disabled,.confirm-btn:disabled{opacity:.4;}
.notice-box{padding:14px 16px;border-radius:var(--radius-md);background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:1.02rem;margin-bottom:18px;line-height:1.6;}
.choice-row.three{grid-template-columns:repeat(3,1fr);}
.choice-sub{font-size:.9rem;color:var(--text-secondary);font-weight:600;margin-top:8px;}
.car-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.option-btn.small{padding:12px 18px;font-size:1.05rem;}
.seat-front{font-size:1rem;font-weight:800;color:var(--text-secondary);margin-bottom:10px;text-align:center;}
.seat.sel{background:var(--primary);border-color:var(--primary);color:#fff;}
.seat.tseat{flex-direction:column;width:60px;height:62px;gap:2px;font-size:.95rem;}
.seat.tseat.win{box-shadow:inset 0 0 0 2px #bfdbfe;}
.dir{font-size:.75rem;font-weight:800;padding:1px 6px;border-radius:6px;}
.dir.fwd{background:#dbeafe;color:#1d4ed8;}
.dir.rev{background:#ffedd5;color:#c2410c;}
.seat.occupied .dir{background:transparent;color:#fff;}
.seat.sel .dir{background:rgba(255,255,255,.25);color:#fff;}
.seat-swatch.sel{background:var(--primary);border-color:var(--primary);}
.seat-legend{flex-wrap:wrap;}
.picked-list{margin-top:14px;padding:12px 14px;border-radius:12px;background:#eef2ff;font-size:1.02rem;line-height:1.6;}
.ticket-head{font-size:1.2rem;font-weight:900;margin-bottom:8px;}
.cart-row .big{font-size:1.3rem;font-weight:900;color:var(--primary-dark);}
.disc{display:inline-block;font-size:.8rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--success-bg);color:var(--success);}
.disc.off{background:var(--surface);color:var(--text-faint);border:1px solid var(--border);}
@media (max-width:640px){
  .day-grid{grid-template-columns:repeat(4,1fr);}
  .sched-row.bus,.sched-row.train{grid-template-columns:1fr 1fr;}
  .choice-row.three{grid-template-columns:1fr;}
  .seat.tseat{width:50px;height:56px;font-size:.85rem;}
}
/* ===== 스마트폰 화면용 (폭 640px 이하) — 글자·버튼·여백을 휴대폰에 맞게 줄임 ===== */
@media (max-width:640px){
  html{font-size:calc(15px * var(--font-scale));}
  .app-shell{padding:12px 10px 40px;}
  .app-header{padding:10px 14px;margin-bottom:12px;}
  .app-header .brand{font-size:1.1rem;}
  .hub-intro{padding:18px 16px;margin-bottom:14px;border-radius:var(--radius-md);}
  .hub-intro h1{font-size:1.4rem;margin-bottom:6px;}
  .hub-intro p{font-size:.95rem;}
  .hub-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .hub-card{padding:16px 8px;gap:4px;border-radius:var(--radius-md);}
  .hub-card .emoji{font-size:2.2rem;}
  .hub-card .name{font-size:1.05rem;}
  .hub-card .status{font-size:.8rem;}
  .practice-toolbar{padding:8px;gap:6px;margin-bottom:10px;}
  .toolbar-btn{padding:8px 12px;font-size:.9rem;}
  .font-toggle button{width:36px;height:36px;}
  .progress-wrap{font-size:.85rem;margin-bottom:6px;}
  .kiosk-frame{padding:8px;border-radius:20px;}
  .kiosk-screen{padding:18px 12px;min-height:0;border-radius:14px;}
  .screen-title{font-size:1.35rem;}
  .screen-sub{font-size:.95rem;margin-bottom:16px;}
  .big-tap-btn{min-height:150px;font-size:1.4rem;}
  .big-tap-btn .emoji{font-size:3rem;}
  .choice-card{padding:18px 12px;font-size:1.1rem;}
  .choice-card .emoji{font-size:2rem;margin-bottom:6px;}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .menu-card{padding:14px 8px;}
  .menu-card .emoji{font-size:2rem;}
  .cart-box,.ticket-box{padding:14px;}
  .cart-row{font-size:1rem;gap:10px;}
  .confirm-btn{padding:16px;font-size:1.15rem;}
  .pay-card{padding:16px 10px;}
  .route-bar{font-size:1.1rem;padding:10px;margin-bottom:14px;}
  .route-bar small{font-size:.8rem;}
  .day-btn{padding:8px 2px;}
  .day-btn .num{font-size:1rem;}
  .sched-row{padding:10px;gap:8px;}
  .sched-time{font-size:1.1rem;}
  .count-row{padding:12px;flex-direction:column;align-items:stretch;gap:10px;}
  .count-row .who{font-size:1.15rem;flex:none;text-align:center;}
  .count-ctrl{gap:24px;margin:0;justify-content:center;width:100%;}
  .count-ctrl .qty-btn{width:56px;height:56px;flex:0 0 auto;}
  .notice-box{font-size:.92rem;padding:12px;}
  .seat-row{gap:6px;}
  .seat-map{gap:6px;}
  .seat-aisle{width:14px;}
  .seat{width:44px;height:44px;font-size:.85rem;}
  .seat.tseat{width:48px;height:52px;font-size:.85rem;}
  .seat-legend{gap:8px 14px;font-size:.85rem;}
  .option-btn{padding:12px 16px;font-size:1rem;}
}
</style>
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="brand"><span class="dot"></span>T-Star AI 키오스크 연습장</div>
  </header>

  <!-- ================= HUB ================= -->
  <main id="view-hub" class="view active">
    <div class="hub-intro">
      <h1>어떤 매장을 연습해볼까요?</h1>
      <p>실제 키오스크와 똑같이 생긴 화면에서 안전하게 연습할 수 있어요. 잘못 눌러도 괜찮아요 — 다시 안내해 드립니다. 원하는 매장을 눌러서 시작해보세요.</p>
    </div>
    <div class="hub-grid" id="hub-grid"></div>
  </main>

  <!-- ================= PRACTICE ================= -->
  <main id="view-practice" class="view">
    <div class="practice-toolbar">
      <button class="toolbar-btn" id="btn-to-hub">🏠 매장 선택</button>
      <span id="practice-title" style="font-weight:800;color:var(--text-secondary);"></span>
      <button class="toolbar-btn" id="btn-back" disabled>◀ 이전 화면</button>
      <button class="toolbar-btn restart" id="btn-restart">🔄 처음부터</button>
      <div class="toolbar-spacer"></div>
      <div class="font-toggle">
        <button id="font-down" title="글자 작게">가−</button>
        <button id="font-up" title="글자 크게">가+</button>
      </div>
    </div>
    <div class="progress-wrap" style="margin-bottom:14px;">
      <span id="progress-label">1단계 / 8단계</span>
      <div class="progress-dots" id="progress-dots"></div>
    </div>

    <div class="kiosk-frame">
      <div class="kiosk-screen" id="kiosk-screen"></div>
    </div>
  </main>

  <!-- ================= SUMMARY ================= -->
  <main id="view-summary" class="view">
    <div class="summary-box">
      <div class="emoji">🎉</div>
      <h2 id="summary-title">주문 연습을 완료했어요!</h2>
      <p>실제 매장에서도 이 순서대로 하시면 돼요. 정말 잘하셨어요!</p>
      <div class="stat-row">
        <div class="stat-item"><div class="num" id="stat-time">0분 0초</div><div class="label">걸린 시간</div></div>
        <div class="stat-item"><div class="num" id="stat-a">-</div><div class="label" id="stat-a-label">담은 항목</div></div>
        <div class="stat-item"><div class="num" id="stat-b">-</div><div class="label" id="stat-b-label">결제 금액</div></div>
      </div>
      <div class="summary-actions">
        <button class="btn-primary" id="btn-next-scenario" style="display:none;"></button>
        <button class="btn-secondary" id="btn-retry">다시 연습하기</button>
        <button class="btn-secondary" id="btn-summary-hub">🏠 다른 매장 보기</button>
      </div>
    </div>
  </main>

</div>

<div class="hub-toast" id="hub-toast"></div>
<div id="feedback-toast"></div>

<script>
(function(){
  "use strict";

  /* ============ 공통: 화면 전환 ============ */
  function showView(id){
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }

  /* 받침 유무에 따라 조사(은/는, 이/가, 이에요/예요 등)를 자동으로 골라줌 */
  function hasBatchim(word){
    var w = (word || "").trim();
    var ch = w.charCodeAt(w.length - 1);
    if(isNaN(ch) || ch < 0xAC00 || ch > 0xD7A3) return false;
    return (ch - 0xAC00) % 28 !== 0;
  }
  function josa(word, withBatchim, noBatchim){
    return hasBatchim(word) ? withBatchim : noBatchim;
  }

  /* div 기반 카드도 키보드/스크린리더로 사용할 수 있도록 버튼 역할 부여 */
  function bindActivate(el, handler){
    el.setAttribute("tabindex", "0");
    if(!el.hasAttribute("role")) el.setAttribute("role", "button");
    el.addEventListener("click", handler);
    el.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){
        e.preventDefault();
        handler(e);
      }
    });
  }

  /* ============ 글자 크기 조절 ============ */
  var fontLevels = [1, 1.15, 1.3];
  var fontLevelIdx = 0;
  function applyFontScale(){
    document.documentElement.style.setProperty("--font-scale", fontLevels[fontLevelIdx]);
  }
  document.getElementById("font-up").addEventListener("click", function(){
    fontLevelIdx = Math.min(fontLevelIdx + 1, fontLevels.length - 1);
    applyFontScale();
  });
  document.getElementById("font-down").addEventListener("click", function(){
    fontLevelIdx = Math.max(fontLevelIdx - 1, 0);
    applyFontScale();
  });

  /* ============ 허브 화면 ============ */
  var stores = [
    { id:"cafe", name:"카페", emoji:"☕", enabled:true },
    { id:"restaurant", name:"음식점", emoji:"🍽️", enabled:true },
    { id:"mart", name:"마트", emoji:"🛒", enabled:true },
    { id:"hospital", name:"병원", emoji:"🏥", enabled:true },
    { id:"store", name:"무인가게", emoji:"🏪", enabled:true },
    { id:"fastfood", name:"패스트푸드", emoji:"🍔", enabled:true },
    { id:"bus", name:"시외·고속버스", emoji:"🚌", enabled:true },
    { id:"train", name:"기차", emoji:"🚆", enabled:true },
    { id:"civil", name:"무인민원발급기", emoji:"🏛️", enabled:true }
  ];

  var hubGrid = document.getElementById("hub-grid");
  stores.forEach(function(store){
    var card = document.createElement("div");
    card.className = "hub-card " + (store.enabled ? "enabled" : "disabled");
    card.innerHTML =
      (store.enabled ? "" : '<span class="badge-soon">준비 중</span>') +
      '<span class="emoji">' + store.emoji + '</span>' +
      '<span class="name">' + store.name + '</span>' +
      '<span class="status">' + (store.enabled ? "연습 시작 가능" : "곧 추가돼요") + '</span>';
    bindActivate(card, function(){
      if(store.enabled){
        startScenario(store.id);
      } else {
        showHubToast(store.name + josa(store.name, "은", "는") + " 곧 준비돼요! 먼저 다른 매장부터 연습해보세요 😊");
      }
    });
    hubGrid.appendChild(card);
  });

  var hubToastTimer = null;
  function showHubToast(msg){
    var el = document.getElementById("hub-toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(hubToastTimer);
    hubToastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }

  document.getElementById("btn-to-hub").addEventListener("click", function(){ showView("view-hub"); });
  document.getElementById("btn-summary-hub").addEventListener("click", function(){ showView("view-hub"); });
  document.getElementById("btn-retry").addEventListener("click", function(){ startScenario(currentScenarioId); });
  document.getElementById("btn-restart").addEventListener("click", function(){ startScenario(currentScenarioId); });

  document.getElementById("btn-back").addEventListener("click", function(){
    if(history.length > 0){
      screenIndex = history.pop();
      renderScreen();
    }
  });

  /* ============ 연습 엔진 (모든 매장 공통) ============ */
  var scenarioDefs = {};
  var state, screenIndex, history, currentScenarioId, currentScreens;
  var startTime = 0;

  function startScenario(id){
    var def = scenarioDefs[id];
    currentScenarioId = id;
    currentScreens = def.screens;
    state = def.initialState();
    screenIndex = 0;
    history = [];
    startTime = Date.now();
    document.getElementById("practice-title").textContent = def.emoji + " " + def.title + " 연습 중";
    showView("view-practice");
    renderScreen();
  }

  function goToScreen(nextIndex){
    history.push(screenIndex);
    screenIndex = nextIndex;
    renderScreen();
  }

  var feedbackTimer = null;
  function showFeedback(msg, ok){
    var el = document.getElementById("feedback-toast");
    el.textContent = msg;
    el.classList.toggle("ok", !!ok);
    el.classList.add("show");
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600);
  }

  /* ============ 자유 주문 공용 헬퍼 ============ */
  function formatWon(n){
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "원";
  }
  function cartTotal(cart){
    return cart.reduce(function(sum, item){ return sum + item.price * item.qty; }, 0);
  }
  function cartCount(cart){
    return cart.reduce(function(sum, item){ return sum + item.qty; }, 0);
  }
  function renderCartBox(cart, emptyMsg){
    if(cart.length === 0){
      return '<div class="cart-box"><div style="text-align:center;color:var(--text-faint);padding:20px 0;">' + emptyMsg + '</div></div>';
    }
    var rows = cart.map(function(item, i){
      return (
        '<div class="cart-row-item">' +
          '<div class="info"><span class="label">' + item.emoji + ' ' + item.name +
            (item.optionLabel ? ' <span style="color:var(--text-faint);font-size:.85em;">(' + item.optionLabel + ')</span>' : '') +
            ' × ' + item.qty + '</span><span>' + formatWon(item.price * item.qty) + '</span></div>' +
          '<button class="delete-btn" data-idx="' + i + '" title="삭제">🗑️</button>' +
        '</div>'
      );
    }).join("");
    return (
      '<div class="cart-box">' + rows +
        '<div class="cart-row" style="margin-top:10px;">' +
          '<span class="label" style="font-weight:800;">합계</span>' +
          '<span style="font-weight:900;color:var(--primary-dark);font-size:1.2rem;">' + formatWon(cartTotal(cart)) + '</span>' +
        '</div>' +
      '</div>'
    );
  }
  function attachCartDelete(root, cart, onChange){
    root.querySelectorAll(".delete-btn[data-idx]").forEach(function(btn){
      btn.addEventListener("click", function(){
        cart.splice(Number(btn.getAttribute("data-idx")), 1);
        onChange();
      });
    });
  }
  function renderCartBadge(cart, btnLabel, disabledMsg){
    var count = cartCount(cart);
    return (
      '<div class="cart-badge">' +
        '<span class="info">담은 개수 <b>' + count + '개</b> · 합계 <b>' + formatWon(cartTotal(cart)) + '</b></span>' +
        '<button id="act-go-cart"' + (count === 0 ? " disabled" : "") + '>' + btnLabel + '</button>' +
      '</div>'
    );
  }
  function attachCartBadge(root, onGo){
    var btn = root.querySelector("#act-go-cart");
    if(btn && !btn.disabled) btn.addEventListener("click", onGo);
  }

  var PAY_METHODS = [
    {id:"card", name:"카드", emoji:"💳", desc:"카드 투입구에 카드를 넣어주세요"},
    {id:"kakao", name:"카카오페이", emoji:"💛", desc:"QR코드를 스캐너에 대주세요"},
    {id:"naver", name:"네이버페이", emoji:"💚", desc:"QR코드를 스캐너에 대주세요"},
    {id:"cash", name:"현금", emoji:"💵", desc:"현금 투입구에 지폐를 넣어주세요"}
  ];
  function payMethodInfo(id){
    for(var i = 0; i < PAY_METHODS.length; i++){ if(PAY_METHODS[i].id === id) return PAY_METHODS[i]; }
    return PAY_METHODS[0];
  }
  function renderPayGrid(methods){
    var list = methods || PAY_METHODS;
    return '<div class="pay-grid">' + list.map(function(p){
      return '<div class="pay-card" data-pay="' + p.id + '"><span class="emoji">' + p.emoji + '</span>' + p.name + '</div>';
    }).join("") + '</div>';
  }
  function attachPayGrid(root, onSelect){
    root.querySelectorAll(".pay-card").forEach(function(card){
      bindActivate(card, function(){ onSelect(card.getAttribute("data-pay")); });
    });
  }
  function paymentAnimScreen(nextIndex){
    return {
      label:"결제 진행",
      render:function(){
        var info = payMethodInfo(state.payment);
        return (
          '<div class="screen-title">' + info.name + ' 결제 중이에요</div>' +
          '<div class="screen-sub">' + info.desc + '</div>' +
          '<div class="card-slot-wrap">' +
            '<div class="card-slot" id="act-insert">' + info.emoji + '</div>' +
            '<div class="status-text" id="pay-status">' + info.desc + '</div>' +
          '</div>'
        );
      },
      attach:function(root){
        var done = false;
        bindActivate(root.querySelector("#act-insert"), function(){
          if(done) return;
          done = true;
          var slot = root.querySelector("#act-insert");
          var status = root.querySelector("#pay-status");
          slot.classList.add("inserting");
          status.textContent = "결제 처리 중입니다...";
          setTimeout(function(){
            slot.classList.remove("inserting");
            status.textContent = "결제가 완료되었습니다 ✅";
            setTimeout(function(){ goToScreen(nextIndex); }, 900);
          }, 1300);
        });
      }
    };
  }

  function renderScreen(){
    var screen = currentScreens[screenIndex];
    var root = document.getElementById("kiosk-screen");
    root.innerHTML = screen.render();
    screen.attach(root);

    document.getElementById("btn-back").disabled = history.length === 0;
    document.getElementById("progress-label").textContent = (screenIndex + 1) + "단계 / " + currentScreens.length + "단계";

    var dotsWrap = document.getElementById("progress-dots");
    dotsWrap.innerHTML = "";
    currentScreens.forEach(function(s, i){
      var dot = document.createElement("span");
      dot.className = "dot" + (i < screenIndex ? " done" : "") + (i === screenIndex ? " current" : "");
      dotsWrap.appendChild(dot);
    });
  }

  function finishScenario(){
    var elapsed = Math.round((Date.now() - startTime) / 1000);
    var min = Math.floor(elapsed / 60);
    var sec = elapsed % 60;
    document.getElementById("stat-time").textContent = min + "분 " + sec + "초";

    var def = scenarioDefs[currentScenarioId];
    var stats = def.summaryStats ? def.summaryStats(state) : null;
    stats = stats || { aLabel:"담은 항목", aVal:"-", bLabel:"결제 금액", bVal:"-" };
    document.getElementById("stat-a-label").textContent = stats.aLabel;
    document.getElementById("stat-a").textContent = stats.aVal;
    document.getElementById("stat-b-label").textContent = stats.bLabel;
    document.getElementById("stat-b").textContent = stats.bVal;

    var scenarioTitle = scenarioDefs[currentScenarioId].title;
    document.getElementById("summary-title").textContent = scenarioTitle + josa(scenarioTitle, "을", "를") + " 완료했어요!";
    document.getElementById("btn-retry").textContent = scenarioDefs[currentScenarioId].emoji + " 다시 연습하기";

    var nextId = scenarioDefs[currentScenarioId].nextScenario;
    var nextBtn = document.getElementById("btn-next-scenario");
    if(nextId && scenarioDefs[nextId]){
      nextBtn.style.display = "";
      nextBtn.textContent = scenarioDefs[nextId].emoji + " 이어서 " + scenarioDefs[nextId].title + " 연습하기";
      nextBtn.onclick = function(){ startScenario(nextId); };
    } else {
      nextBtn.style.display = "none";
      nextBtn.onclick = null;
    }
    showView("view-summary");
  }

  /* ============ 시나리오: 카페 ============ */
  var cafeMenuData = {
    coffee: [
      {id:"americano", name:"아메리카노", price:2500, emoji:"☕", temp:true},
      {id:"latte", name:"카페라떼", price:3000, emoji:"🥛", temp:true},
      {id:"cappuccino", name:"카푸치노", price:3000, emoji:"☕", temp:true},
      {id:"vanilla", name:"바닐라라떼", price:3500, emoji:"🍦", temp:true},
      {id:"caramel", name:"카라멜마키아또", price:4000, emoji:"🍯", temp:true}
    ],
    nonc: [
      {id:"ade", name:"자몽에이드", price:3800, emoji:"🍊", temp:false},
      {id:"smoothie", name:"딸기스무디", price:4200, emoji:"🍓", temp:false},
      {id:"greentea", name:"녹차라떼", price:4000, emoji:"🍵", temp:true}
    ],
    dessert: [
      {id:"cake", name:"치즈케이크", price:5000, emoji:"🍰"},
      {id:"cookie", name:"초코쿠키", price:2000, emoji:"🍪"},
      {id:"croissant", name:"크로아상", price:3200, emoji:"🥐"}
    ]
  };
  var cafeActiveTab = "coffee";
  var cafeSizeAdd = {"Tall":0, "Grande":500, "Venti":1000};

  function cafeAllItems(){
    return cafeMenuData.coffee.concat(cafeMenuData.nonc, cafeMenuData.dessert);
  }
  function cafeItemPrice(p){
    var base = cafeAllItems().filter(function(x){ return x.id === p.id; })[0].price;
    return base + (p.hasSize ? cafeSizeAdd[p.size] : 0);
  }

  var cafeScreens = [
    /* 0. 시작 화면 */
    {
      label:"시작",
      render:function(){
        return (
          '<div class="screen-title">환영합니다 ☕</div>' +
          '<div class="screen-sub">화면을 터치하여 주문을 시작해주세요.</div>' +
          '<button class="big-tap-btn" id="act-start"><span class="emoji">👋</span>터치하여 시작하기</button>'
        );
      },
      attach:function(root){
        root.querySelector("#act-start").addEventListener("click", function(){
          goToScreen(1);
        });
      }
    },
    /* 1. 주문 방법 */
    {

  function upcomingDays(count){
    var list = [];
    var base = new Date(); base.setHours(0,0,0,0);
    for(var i = 0; i < count; i++){
      var d = new Date(base.getTime()); d.setDate(base.getDate() + i);

        label:(d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + WEEK_KO[d.getDay()] + ")" });
    }
    return list;
  }

      var cls = "day-btn" + (d.dow === 0 ? " sun" : "") + (d.dow === 6 ? " sat" : "") + (selOffset === d.offset ? " selected" : "");
      var top = d.offset === 0 ? "오늘" : (d.offset === 1 ? "내일" : WEEK_KO[d.dow] + "요일");
      return '<button class="' + cls + '" data-offset="' + d.offset + '"><span class="dow">' + top + '</span><span class="num">' + d.month + '/' + d.day + '</span></button>';
    }).join("") + '</div>';

  function nowMinutes(){ var n = new Date(); return n.getHours() * 60 + n.getMinutes(); }

  function hhmm(min){ min = ((min % 1440) + 1440) % 1440; var h = Math.floor(min / 60), m = min % 60; return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
  function durText(min){ var h = Math.floor(min / 60), m = min % 60; return (h > 0 ? h + "시간" : "") + (h > 0 && m > 0 ? " " : "") + (m > 0 ? m + "분" : ""); }
  function floor100(n){ return Math.floor(n / 100) * 100; }
  function paxTotal(pax){ var t = 0; for(var k in pax){ if(pax.hasOwnProperty(k)) t += pax[k]; } return t; }
  function paxList(pax, defs){
    var list = [];
    defs.forEach(function(d){ for(var i = 0; i < pax[d.id]; i++) list.push(d); });

          '</div>' +
        '</div>'
      );
    }).join("");

    root.querySelectorAll("[data-cnt]").forEach(function(btn){

  function busRouteById(id){ for(var i = 0; i < busRoutes.length; i++){ if(busRoutes[i].id === id) return busRoutes[i]; } return null; }
  function busSchedule(route, dayOffset){
    var rIdx = busRoutes.indexOf(route);
    return route.times.map(function(t, i){
      var grade = (route.normal && i % 2 === 1) ? "normal" : "udeung";
      var seed = (rIdx + 1) * 1000 + i * 37 + dayOffset * 7;
      var dep = toMin(t);
      return { idx:i, time:t, dep:dep, grade:grade, seed:seed,
        gone: dayOffset === 0 && dep <= nowMinutes(),
        soldOut: seedRand(seed) < 0.12 };
    });
  }
  function busOccupied(bus, no){ return bus.soldOut || seedRand(bus.seed * 3 + no) < 0.35; }
  function busFreeCount(bus){
    var total = BUS_GRADES[bus.grade].seats, n = 0;
    for(var s = 1; s <= total; s++){ if(!busOccupied(bus, s)) n++; }
    return n;
  }
  function busLayout(grade){
    var rows = [], n = 1, r;
    if(grade === "udeung"){
      for(r = 0; r < 8; r++){ rows.push([n, null, n + 1, n + 2]); n += 3; }
      rows.push([n, n + 1, n + 2, n + 3]);
    } else {
      for(r = 0; r < 10; r++){ rows.push([n, n + 1, null, n + 2, n + 3]); n += 4; }
      rows.push([n, n + 1, n + 2, n + 3, n + 4]);
    }
    return rows;
  }
  function busPaxFare(paxDef){
    var route = busRouteById(state.route);
    return floor100(route[state.bus.grade] * paxDef.rate);
  }
  function busTotal(){
    if(!state.bus) return 0;
    return paxList(state.pax, BUS_PAX).reduce(function(sum, p){ return sum + busPaxFare(p); }, 0);
  }

  /* ============ 시나리오: 기차 (역 승차권 자동발매기) ============ */
  /* 창녕에는 기차역이 없어 동대구·밀양·구미역에서 타는 상황으로 연습합니다. 요금은 거리 기준 연습용 근사치입니다. */
  var trainStations = [
    {id:"seoul", name:"서울", km:0, ktx:true},
    {id:"suwon", name:"수원", km:41.5, ktx:false},
    {id:"daejeon", name:"대전", km:166.3, ktx:true},
    {id:"gumi", name:"구미", km:262.4, ktx:false},
    {id:"dongdaegu", name:"동대구", km:323.1, ktx:true},
    {id:"miryang", name:"밀양", km:381.6, ktx:true},
    {id:"busan", name:"부산", km:441.7, ktx:true}
  ];
  var TRAIN_ORIGINS = [
    {id:"dongdaegu", emoji:"🏙️", info:"KTX · ITX-새마을 · 무궁화호"},
    {id:"miryang", emoji:"🌿", info:"KTX · ITX-새마을 · 무궁화호"},
    {id:"gumi", emoji:"🏭", info:"ITX-새마을 · 무궁화호 (KTX 없음)"}
  ];
  var TRAIN_TYPES = {
    ktx:{name:"KTX", perKm:135, min:8400, kmPerMin:2.9, numBase:102},
    itx:{name:"ITX-새마을", perKm:96, min:4800, kmPerMin:1.6, numBase:1002},
    mugung:{name:"무궁화호", perKm:65, min:2600, kmPerMin:1.35, numBase:1202}
  };
  var TRAIN_PATTERN = [
    ["ktx","06:12"],["mugung","06:40"],["ktx","07:25"],["itx","08:05"],["ktx","09:10"],["mugung","10:02"],
    ["ktx","11:30"],["itx","12:48"],["ktx","14:05"],["mugung","15:20"],["ktx","16:40"],["itx","17:55"],
    ["ktx","19:10"],["mugung","20:25"],["ktx","21:30"]
  ];
  var TRAIN_PAX = [
    {id:"adult", name:"어른", desc:"만 13세 ~ 64세"},
    {id:"senior", name:"경로", desc:"만 65세 이상 · 신분증 필요"},
    {id:"child", name:"어린이", desc:"만 6세 ~ 12세"}
  ];
  function stationById(id){ for(var i = 0; i < trainStations.length; i++){ if(trainStations[i].id === id) return trainStations[i]; } return null; }
  function trainKm(){ return Math.abs(stationById(state.dest).km - stationById(state.origin).km); }
  function isWeekday(offset){ var d = dayInfo(offset).dow; return d >= 1 && d <= 5; }
  function trainSchedule(fromId, toId, dayOffset){
    var from = stationById(fromId), to = stationById(toId);
    var km = Math.abs(to.km - from.km);
    var north = to.km < from.km;
    var oIdx = trainStations.indexOf(from), dIdx = trainStations.indexOf(to);
    var shift = oIdx * 4 + (north ? 0 : 3);
    var count = {ktx:0, itx:0, mugung:0};
    var list = [];
    TRAIN_PATTERN.forEach(function(p, i){
      var type = p[0], T = TRAIN_TYPES[type];
      if(type === "ktx" && !(from.ktx && to.ktx)) return;
      var dep = toMin(p[1]) + shift;
      var run = Math.max(15, Math.round(km / T.kmPerMin));
      var no = T.numBase + count[type] * 2 + (north ? 0 : 1);
      count[type]++;
      var seed = i * 131 + dayOffset * 17 + oIdx * 7 + dIdx * 3;
      list.push({ idx:list.length, type:type, no:no, dep:dep, arr:dep + run, run:run, seed:seed,
        gone: dayOffset === 0 && dep <= nowMinutes(),
        genSold: seedRand(seed) < 0.15, spSold: seedRand(seed + 5) < 0.2 });
    });
    return list;
  }
  function trainBaseFare(type, km){ var T = TRAIN_TYPES[type]; return Math.max(T.min, Math.round(km * T.perKm / 100) * 100); }
  function trainClassFare(type, km, cls){ var g = trainBaseFare(type, km); return cls === "special" ? Math.round(g * 1.4 / 100) * 100 : g; }
  function trainPaxFare(paxId){
    var km = trainKm(), type = state.train.type;
    var g = trainBaseFare(type, km);
    var extra = trainClassFare(type, km, state.cls) - g;
    if(paxId === "senior" && isWeekday(state.dayOffset)) return floor100(g * 0.7) + extra;
    if(paxId === "child") return floor100(g * 0.5) + extra;
    return g + extra;
  }
  function trainTotal(){
    if(!state.train) return 0;
    return paxList(state.pax, TRAIN_PAX).reduce(function(sum, p){ return sum + trainPaxFare(p.id); }, 0);
  }
  function trainCars(type, cls){
    if(type === "ktx") return cls === "special" ? [3, 4] : [5, 6, 7, 8];
    return [1, 2, 3, 4, 5];
  }
  function trainSeatRows(type, cls){
    var rows = [], r, d;
    function s(label, win, dir){ return {label:label, win:win, dir:dir}; }
    if(type === "ktx" && cls === "special"){
      for(r = 1; r <= 10; r++){ d = r <= 5 ? "rev" : "fwd"; rows.push([s(r + "A", true, d), null, s(r + "C", false, d), s(r + "D", true, d)]); }
    } else if(type === "ktx"){
      for(r = 1; r <= 14; r++){ d = r <= 7 ? "rev" : "fwd"; rows.push([s(r + "A", true, d), s(r + "B", false, d), null, s(r + "C", false, d), s(r + "D", true, d)]); }
    } else {
      for(r = 0; r < 15; r++){ var n = r * 4; rows.push([s(String(n + 1), true, "fwd"), s(String(n + 2), false, "fwd"), null, s(String(n + 3), false, "fwd"), s(String(n + 4), true, "fwd")]); }
    }
    return rows;
  }
  function trainOccupied(car, k){ return seedRand(state.train.seed * 11 + car * 97 + k) < 0.4; }
  function trainSeatText(seat){ return seat.car + "호차 " + seat.label + (state.train.type === "ktx" ? "" : "번"); }
  function dirText(dir){ return dir === "rev" ? "역방향" : "순방향"; }
  function trainName(){ return TRAIN_TYPES[state.train.type].name + " " + state.train.no; }
  function trainRouteBar(){
    var extra = "";
    if(state.dayOffset !== null) extra += '<small>' + dayInfo(state.dayOffset).label + '</small>';
    if(state.train) extra += '<small>' + trainName() + ' · ' + hhmm(state.train.dep) + ' 출발 · ' + (state.cls === "special" ? "특실" : "일반실") + '</small>';
    return '<div class="route-bar">' + stationById(state.origin).name + ' <span>➜</span> ' + (state.dest ? stationById(state.dest).name : "?") + extra + '</div>';
  }
  function trainAutoAssign(){
    var need = paxTotal(state.pax);
    var cars = trainCars(state.train.type, state.cls);
    var rows = trainSeatRows(state.train.type, state.cls);
    var picked = [];
    ["fwd", "rev"].forEach(function(wantDir){
      cars.forEach(function(car){
        var k = 0;
        rows.forEach(function(row){
          row.forEach(function(seat){
            if(seat === null) return;
            k++;
            if(picked.length >= need || seat.dir !== wantDir || trainOccupied(car, k)) return;
            picked.push({ id:car + "-" + seat.label, car:String(car), label:seat.label, dir:seat.dir });
          });
        });
      });
    });
    return picked.length === need ? picked : null;
  }

  var trainScreens = [

        }).join("");

        });
        root.querySelector("#act-backspace").addEventListener("click", function(){
          state.rrn = state.rrn.slice(0, -1);
          renderScreen();
        });
        root.querySelector("#act-confirm").addEventListener("click", function(){
          if(state.rrn.length !== 13){
            showFeedback("주민등록번호 13자리를 모두 입력해주세요.", false);
          } else {
            goToScreen(3);
          }
        });
      }
    },
    /* 3. 본인 확인 (지문 인증) */
    {
      label:"지문 인증",
      render:function(){
        return (
          '<div class="screen-title">지문으로 본인 확인을 해주세요</div>' +
          '<div class="screen-sub">지문 인식기에 손가락을 대는 것처럼 아래 그림을 눌러주세요.</div>' +
          '<div class="card-slot-wrap">' +
            '<div class="card-slot" id="act-insert">👆</div>' +
            '<div class="status-text" id="pay-status">지문을 대주세요</div>' +
          '</div>'
        );
      },
      attach:function(root){
        var done = false;
        bindActivate(root.querySelector("#act-insert"), function(){
          if(done) return;
          done = true;
          var slot = root.querySelector("#act-insert");
          var status = root.querySelector("#pay-status");
          slot.classList.add("inserting");
          status.textContent = "지문을 인식 중입니다...";
          setTimeout(function(){
            slot.classList.remove("inserting");
            status.textContent = "본인 확인이 완료되었습니다 ✅";
            setTimeout(function(){ goToScreen(4); }, 900);
          }, 1300);
        });
      }
    },
    /* 4. 발급 부수 선택 */
    {
      label:"발급 부수",
      render:function(){
        return (
          '<div class="screen-title">' + state.docName + ' 발급 부수를 선택해주세요</div>' +
          '<div class="screen-sub">필요한 부수를 정해주세요. (1부당 ' + formatWon(state.fee) + ')</div>' +
          '<div class="qty-stepper">' +
            '<button class="qty-btn" id="qty-minus">−</button>' +
            '<div class="qty-num">' + state.qty + '부</div>' +
            '<button class="qty-btn" id="qty-plus">+</button>' +
          '</div>' +
          '<div class="scan-total">수수료 합계: ' + formatWon(state.fee * state.qty) + '</div>' +
          '<button class="confirm-btn" id="act-add">💳 결제하러 가기</button>'
        );
      },
      attach:function(root){
        root.querySelector("#qty-minus").addEventListener("click", function(){
          state.qty = Math.max(1, state.qty - 1); renderScreen();
        });
        root.querySelector("#qty-plus").addEventListener("click", function(){
          state.qty = Math.min(5, state.qty + 1); renderScreen();
        });
        root.querySelector("#act-add").addEventListener("click", function(){
          goToScreen(5);
        });
      }
    },
    /* 5. 결제 수단 */
    {
      label:"결제 수단",
      render:function(){
        return (
          '<div class="screen-title">수수료 결제 수단을 선택해주세요</div>' +
          '<div class="screen-sub">원하시는 결제 방법을 눌러주세요.</div>' +
          renderPayGrid()
        );
      },
      attach:function(root){
        attachPayGrid(root, function(id){ state.payment = id; goToScreen(6); });
      }
    },
    /* 6. 결제 진행 */
    paymentAnimScreen(7),
    /* 7. 완료 */
    {
      label:"발급 완료",
      render:function(){
        return (
          '<div class="done-box">' +
            '<div class="emoji">🖨️</div>' +
            '<div class="screen-title">발급이 완료되었어요!</div>' +
            '<div class="screen-sub">아래 출력구에서 서류를 꺼내가세요.</div>' +
            '<div class="ticket-box">' +
              '<div class="cart-row"><span class="label">증명서</span><span>' + state.docName + '</span></div>' +
              '<div class="cart-row"><span class="label">부수</span><span>' + state.qty + '부</span></div>' +
              '<div class="cart-row"><span class="label">발급 수수료</span><span>' + formatWon(state.fee * state.qty) + '</span></div>' +
            '</div>' +
            '<button class="confirm-btn" id="act-finish">연습 마치기</button>' +
          '</div>'
        );
      },
      attach:function(root){
        root.querySelector("#act-finish").addEventListener("click", finishScenario);
      }
    }
  ];

  scenarioDefs.civil = {
    title:"무인민원발급기 이용",
    emoji:"🏛️",
    screens: civilScreens,
    initialState:function(){
      return { docId:null, docName:null, fee:0, qty:1, rrn:"", payment:null };
    },
    summaryStats:function(state){
      return { aLabel:"발급 서류", aVal:(state.docName || "-") + " " + state.qty + "부", bLabel:"결제 금액", bVal:formatWon(state.fee * state.qty) };
    }
  };

})();
</script>
</body>
</html>
