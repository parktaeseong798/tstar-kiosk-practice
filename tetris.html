<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>테트리스</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    #game-wrapper {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    canvas {
      border: 2px solid #e94560;
      background: #0f0f23;
      display: block;
    }
    #side-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 140px;
    }
    .panel-box {
      background: #16213e;
      border: 1px solid #e94560;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }
    .panel-box h3 {
      font-size: 12px;
      color: #e94560;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .panel-box p {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }
    #next-canvas {
      border: none;
      background: transparent;
      display: block;
      margin: 0 auto;
    }
    #keys {
      font-size: 11px;
      color: #aaa;
      line-height: 1.8;
      text-align: left;
    }
    #keys span { color: #e94560; font-weight: bold; }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    #overlay h1 { font-size: 48px; color: #e94560; }
    #overlay p { font-size: 18px; color: #ccc; }
    #overlay button {
      margin-top: 10px;
      padding: 12px 36px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #overlay button:hover { background: #c73652; }
  </style>
</head>
<body>

<div id="overlay">
  <h1>테트리스</h1>
  <p>방향키로 블록을 조작하세요</p>
  <button onclick="startGame()">게임 시작</button>
</div>

<div id="game-wrapper">
  <canvas id="board" width="300" height="600"></canvas>
  <div id="side-panel">
    <div class="panel-box">
      <h3>점수</h3>
      <p id="score">0</p>
    </div>
    <div class="panel-box">
      <h3>레벨</h3>
      <p id="level">1</p>
    </div>
    <div class="panel-box">
      <h3>라인</h3>
      <p id="lines">0</p>
    </div>
    <div class="panel-box">
      <h3>다음</h3>
      <canvas id="next-canvas" width="120" height="120"></canvas>
    </div>
    <div class="panel-box">
      <div id="keys">
        <span>←→</span> 이동<br>
        <span>↑</span> 회전<br>
        <span>↓</span> 빠르게<br>
        <span>Space</span> 즉시 낙하<br>
        <span>P</span> 일시정지
      </div>
    </div>
  </div>
</div>

<script>
const COLS = 10, ROWS = 20, BLOCK = 30;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next-canvas');
const nCtx = nextCanvas.getContext('2d');

const COLORS = ['', '#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];
const SHAPES = [
  [],
  [[1,1,1,1]],
  [[2,0],[2,0],[2,2]],
  [[0,3],[0,3],[3,3]],
  [[4,4],[4,4]],
  [[0,5,5],[5,5,0]],
  [[6,6,0],[0,6,6]],
  [[0,7,0],[7,7,7]],
];

let board, current, next, score, level, lines, gameRunning, paused, animId, dropInterval, lastDrop;

function emptyBoard() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
}

function randomPiece() {
  const id = Math.floor(Math.random() * 7) + 1;
  const shape = SHAPES[id].map(r => [...r]);
  return { id, shape, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
}

function valid(piece, dx = 0, dy = 0, shape = piece.shape) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const nx = piece.x + c + dx, ny = piece.y + r + dy;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
      if (ny >= 0 && board[ny][nx]) return false;
    }
  }
  return true;
}

function rotate(shape) {
  const rows = shape.length, cols = shape[0].length;
  return Array.from({ length: cols }, (_, c) =>
    Array.from({ length: rows }, (_, r) => shape[rows - 1 - r][c])
  );
}

function place() {
  current.shape.forEach((row, r) => {
    row.forEach((v, c) => {
      if (v) board[current.y + r][current.x + c] = current.id;
    });
  });
  clearLines();
  current = next;
  next = randomPiece();
  if (!valid(current)) endGame();
  drawNext();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(v => v)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(0));
      cleared++;
      r++;
    }
  }
  if (cleared) {
    const pts = [0, 100, 300, 500, 800];
    score += (pts[cleared] || 800) * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 1000 - (level - 1) * 90);
    updateUI();
  }
}

function hardDrop() {
  while (valid(current, 0, 1)) current.y++;
  place();
}

function drawBlock(context, x, y, colorId, alpha = 1) {
  const color = COLORS[colorId];
  context.globalAlpha = alpha;
  context.fillStyle = color;
  context.fillRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 2, BLOCK - 2);
  context.fillStyle = 'rgba(255,255,255,0.2)';
  context.fillRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 2, 4);
  context.fillRect(x * BLOCK + 1, y * BLOCK + 1, 4, BLOCK - 2);
  context.globalAlpha = 1;
}

function ghostY() {
  let gy = current.y;
  while (valid(current, 0, gy - current.y + 1)) gy++;
  return gy;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    ctx.strokeRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);
  }
  board.forEach((row, r) => row.forEach((v, c) => { if (v) drawBlock(ctx, c, r, v); }));
  const gy = ghostY();
  if (gy !== current.y) {
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) drawBlock(ctx, current.x + c, gy + r, current.id, 0.2);
    }));
  }
  current.shape.forEach((row, r) => row.forEach((v, c) => {
    if (v) drawBlock(ctx, current.x + c, current.y + r, current.id);
  }));
}

function drawNext() {
  nCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  const s = next.shape, offsetX = Math.floor((4 - s[0].length) / 2), offsetY = Math.floor((4 - s.length) / 2);
  s.forEach((row, r) => row.forEach((v, c) => {
    if (v) {
      nCtx.fillStyle = COLORS[next.id];
      nCtx.fillRect((offsetX + c) * 30 + 1, (offsetY + r) * 30 + 1, 28, 28);
    }
  }));
}

function updateUI() {
  document.getElementById('score').textContent = score.toLocaleString();
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
}

function loop(ts) {
  if (!gameRunning || paused) return;
  if (ts - lastDrop > dropInterval) {
    if (valid(current, 0, 1)) current.y++;
    else place();
    lastDrop = ts;
  }
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  board = emptyBoard();
  score = 0; level = 1; lines = 0;
  dropInterval = 1000;
  current = randomPiece();
  next = randomPiece();
  gameRunning = true; paused = false;
  lastDrop = performance.now();
  updateUI();
  drawNext();
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

function endGame() {
  gameRunning = false;
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `
    <h1 style="color:#e94560">게임 오버</h1>
    <p>최종 점수: <strong>${score.toLocaleString()}</strong></p>
    <p>레벨: ${level} | 라인: ${lines}</p>
    <button onclick="startGame()">다시 하기</button>
  `;
  overlay.style.display = 'flex';
}

document.addEventListener('keydown', e => {
  if (!gameRunning) return;
  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    if (!paused) { lastDrop = performance.now(); animId = requestAnimationFrame(loop); }
    return;
  }
  if (paused) return;
  switch (e.key) {
    case 'ArrowLeft':  if (valid(current, -1)) current.x--; break;
    case 'ArrowRight': if (valid(current,  1)) current.x++; break;
    case 'ArrowDown':
      if (valid(current, 0, 1)) current.y++;
      else place();
      lastDrop = performance.now();
      break;
    case 'ArrowUp': {
      const r = rotate(current.shape);
      if (valid(current, 0, 0, r)) current.shape = r;
      else if (valid(current, 1, 0, r)) { current.shape = r; current.x++; }
      else if (valid(current, -1, 0, r)) { current.shape = r; current.x--; }
      break;
    }
    case ' ': e.preventDefault(); hardDrop(); break;
  }
  draw();
});
</script>
</body>
</html>
